# One-click blueprint for Render.com
# Creates: a Docker web service + a managed PostgreSQL database, wired together.
#
# ⚠️ Free-plan caveats (see DEPLOY.md):
#   - free web service sleeps after 15 min idle and has ephemeral storage
#     (uploaded/processed videos vanish on redeploy — paid plans support the disk below)
#   - free Postgres EXPIRES after 30 days (upgrade to 0.1c-256mb before then)
services:
  - type: web
    name: clipforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - key: NODE_ENV
        value: production
    # Persistent uploads (requires a paid web plan — uncomment when upgrading):
    # disk:
    #   name: clipforge-storage
    #   mountPath: /app/storage
    #   sizeGB: 20

databases:
  - name: clipforge-db
    databaseName: clipforge
    plan: free
